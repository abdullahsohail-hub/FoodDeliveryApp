
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub | Customer Management</title>
    <link rel="stylesheet" href="/customers.css">
</head>
<body>

<main class="container">

    <header class="page-heading">
        <div>
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>Customer Management</h1>
            <p>View customer accounts, spending and order history.</p>
        </div>
    </header>

    <section class="stats">
        <article class="stat-card">
            <p>Total Customers</p>
            <h2 id="customer-count">0</h2>
        </article>

        <article class="stat-card">
            <p>Customers Found</p>
            <h2 id="results-count">0</h2>
        </article>
    </section>

    <section class="panel">
        <div class="search-row">
            <input
                type="search"
                id="customer-search"
                placeholder="Search by customer name, email or phone..."
            >

            <button id="search-button">Search</button>
            <button id="reset-button" class="secondary-button">
                Reset
            </button>
        </div>

        <p id="message"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Orders</th>
                        <th>Total Spent</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="customer-list"></tbody>
            </table>
        </div>
    </section>

    <section class="panel" id="customer-details" hidden>
        <div class="section-heading">
            <h2>Customer Details</h2>
            <button id="close-details" class="secondary-button">
                Close
            </button>
        </div>

        <div id="customer-profile"></div>

        <h3>Order History</h3>
        <div id="customer-orders"></div>
    </section>

</main>

<script src="/customers.js"></script>
<script src="/admin-nav.js"></script>

</body>
</html>
